services:
  postgres:
    image: postgres:16-alpine
    container_name: rovanx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rovanx
      POSTGRES_PASSWORD: ${ROVANX_DB_PASSWORD:?Set ROVANX_DB_PASSWORD in .env}
      POSTGRES_DB: rovanx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rovanx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rovanx -d rovanx"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rovanx-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rovanx:${ROVANX_DB_PASSWORD:?Set ROVANX_DB_PASSWORD in .env}@postgres:5432/rovanx?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
    ports:
      - "3000:3000"

volumes:
  rovanx-postgres-data:
