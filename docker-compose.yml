services:
  postgres:
    image: postgres:16-alpine
    container_name: rovanx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rovanx
      POSTGRES_PASSWORD: rovanx
      POSTGRES_DB: rovanx
    ports:
      - "5432:5432"
    volumes:
      - rovanx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rovanx -d rovanx"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rovanx-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rovanx:rovanx@postgres:5432/rovanx?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@rovanx.local
      ADMIN_PASSWORD: change-this-admin-password
      ADMIN_SESSION_SECRET: replace-with-a-long-random-secret
    ports:
      - "3000:3000"

volumes:
  rovanx-postgres-data:
